{% extends "base.html" %}

{% block title %}{{ 'Editar' if usuario else 'Nuevo' }} Usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-white">
                <h5 class="mb-0">{{ 'Editar' if usuario else 'Crear Nuevo' }} Usuario</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ usuario.nombre if usuario else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Nombre de Usuario</label>
                        <input type="text" class="form-control" id="usuario" name="usuario" value="{{ usuario.usuario if usuario else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña {{ '(dejar en blanco para no cambiar)' if usuario else '' }}</label>
                        <input type="password" class="form-control" id="password" name="password" {{ 'required' if not usuario else '' }}>
                    </div>
                    <div class="mb-3">
                        <label for="rol" class="form-label">Rol</label>
                        <select class="form-select" id="rol" name="rol" required>
                            <option value="capturista" {{ 'selected' if usuario and usuario.rol == 'capturista' else '' }}>Capturista</option>
                            <option value="invitado" {{ 'selected' if usuario and usuario.rol == 'invitado' else '' }}>Invitado (solo lectura)</option>
                            <option value="administrador" {{ 'selected' if usuario and usuario.rol == 'administrador' else '' }}>Administrador</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('gestionar_usuarios') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar Usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
